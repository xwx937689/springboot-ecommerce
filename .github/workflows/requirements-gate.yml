name: Requirements Gate

# 需求分析质量门禁：golden 样本回归（mock 路径，确定性，零密钥）。
# 与本地手动入口 requirements/eval/check.ps1 共用同一脚本同一判分逻辑——
# "先手动后自动"的既定决策：接 CI 只是把入口挂上，判分不换轨。
# 触发范围：需求包代码/词表/样例/golden/本文件变更才跑，无关提交不空跑。

on:
  workflow_dispatch: { }
  push:
    branches: [ main ]
    paths:
      - 'api-test-platform/requirements/**'
      - 'api-test-platform/pyproject.toml'
      - '.github/workflows/requirements-gate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api-test-platform/requirements/**'
      - 'api-test-platform/pyproject.toml'
      - '.github/workflows/requirements-gate.yml'

jobs:
  golden-gate:
    name: Golden Sample Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install platform
        run: pip install -e api-test-platform

      - name: Golden gate (check.ps1, exit code = PASS/FAIL)
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass
          -File api-test-platform/requirements/eval/check.ps1

      - name: Upload gate product (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: req-gate-product
          path: /tmp/req-gate.json
          if-no-files-found: ignore
