[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# flat-layout 下有多个顶层目录（analyzer/executor/generator/parser + 非包目录），
# 不显式声明时 setuptools 自动发现会报 "Multiple top-level packages" 秒败（CI 首跑实证）
[tool.setuptools.packages.find]
include = ["analyzer*", "chaos*", "executor*", "generator*", "parser*"]

[project]
name = "api-test-platform"
version = "0.1.0"
description = "Enterprise-grade AI-powered API automation testing platform (Phase 0-15 roadmap)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.30",
    "pytest>=8.0",
    "pytest-html>=4.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["black", "ruff", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
