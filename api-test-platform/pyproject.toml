[project]
name = "api-test-platform"
version = "0.1.0"
description = "Enterprise-grade AI-powered API automation testing platform (Phase 0-15 roadmap)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.30",
    "pytest>=8.0",
    "pytest-html>=4.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["black", "ruff", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
